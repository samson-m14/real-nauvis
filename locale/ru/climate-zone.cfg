[map-gen-preset-name]
climate-zone=Климатическая зона

[map-gen-preset-description]
climate-zone=Добавляет реалистичные климатические градиенты на Наувис: зелёные северные леса, сухие южные пустыни, плавные переходы биомов и расширенную генерацию поверхности.

[mod-setting-name]
rn-ore-mixing-enabled=Смешивание руд
rn-ore-mixing-percent=Доля примесей руды
rn-stone-regions-enabled=Каменные поля

[mod-setting-description]
rn-ore-mixing-enabled=Включает генерацию смешанных месторождений с примесями других руд (например, медь в железной жиле).
rn-ore-mixing-percent=Вероятность замены отдельной клетки месторождения примесной рудой в смешанных патчах. 0 % — полностью чистые ванильные месторождения.
rn-stone-regions-enabled=Включает особые каменные регионы с плотными кучами валунов и мелких камней, разбросанных по поверхности.
