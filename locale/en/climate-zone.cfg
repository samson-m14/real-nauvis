[map-gen-preset-name]
climate-zone=Climate zone

[map-gen-preset-description]
climate-zone=Adds realistic climate gradients on Nauvis: green northern forests, dry southern deserts, smooth biome transitions and custom terrain generation.

[mod-setting-name]
rn-ore-mixing-enabled=Ore mixing
rn-ore-mixing-percent=Ore impurity percent
rn-stone-regions-enabled=Stone fields

[mod-setting-description]
rn-ore-mixing-enabled=Enables mixed ore patches with small amounts of other ores as impurities (for example copper in iron patches).
rn-ore-mixing-percent=Chance for each ore tile in a mixed patch to be replaced with an impurity ore. 0% means vanilla pure patches.
rn-stone-regions-enabled=Enables special stone-field regions with dense clusters of boulders and small rocks scattered across the terrain.
