[map-gen-preset-name]
climate-zone=Climate zone

[map-gen-preset-description]
climate-zone=Adds realistic climate gradients on Nauvis: green northern forests, dry southern deserts, smooth biome transitions and custom terrain generation.

[mod-setting-name]
rn-ore-mixing-enabled=Enable ore mixing
rn-ore-mixing-percent=Impurity size, %

[mod-setting-description]
rn-ore-mixing-enabled=If disabled, ore patches will be generated as pure, without any mixed tiles.
rn-ore-mixing-percent=Percentage of tiles in an ore patch that will be replaced with impurities. 0% means no impurities, 100% means the whole patch follows the mixing rules.